<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dataroom Admin - dark airy content-first</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14161a;
    --panel: #1a1d22;
    --panel-2: #202429;
    --line: #2b3037;
    --fg: #e9ecf1;
    --muted: #8b93a1;
    --accent: #2f9fd8;
    --radius: 10px;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
    display: flex; overflow: hidden;
  }

  /* single wide tree panel, no icon rail */
  .tree {
    width: 300px; flex: 0 0 300px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .tree-head { padding: 20px 18px 12px; }
  .tree-head .org { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tree-head h1 { font-size: 17px; font-weight: 700; margin-top: 4px; letter-spacing: -.015em; }
  .search {
    margin-top: 14px; display: flex; align-items: center; gap: 8px;
    background: #121418; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    color: var(--muted); font-size: 13px;
  }
  .tree-list { flex: 1; overflow: auto; padding: 10px 12px 24px; }
  .grp { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #676f7c; padding: 14px 8px 6px; }
  .node {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
    font-size: 13.5px; cursor: pointer; color: #cfd5de; user-select: none; transition: .12s;
  }
  .node:hover { background: #21262c; color: #fff; }
  .node.sel { background: rgba(47,159,216,.16); color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
  .node .ic { color: var(--muted); font-size: 13px; }
  .node.sel .ic { color: var(--accent); }
  .node .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .kids { padding-left: 18px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 62px; flex: 0 0 62px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
  }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb b { color: var(--fg); font-weight: 600; }
  .acts { display: flex; gap: 10px; }
  .btn {
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; color: #d3d8e0; cursor: pointer; transition: .12s;
  }
  .btn:hover { background: var(--panel-2); border-color: #3a4048; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #06121a; }
  .btn.pri:hover { filter: brightness(1.1); }

  .content { flex: 1; overflow: auto; padding: 30px 26px 48px; }
  .lede { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .lede span { color: var(--muted); font-weight: 500; }
  .sub { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 34px 0 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; cursor: pointer; transition: .15s;
  }
  .card:hover { border-color: rgba(47,159,216,.5); transform: translateY(-2px); }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .card .thumb {
    width: 40px; height: 40px; border-radius: 9px; background: #2a2f36;
    display: grid; place-items: center; font-size: 17px;
  }
  .card .nm { font-size: 15px; font-weight: 600; }
  .card .brand { font-size: 11px; color: #6c7482; margin-top: 2px; }
  .card .meta { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); padding: 0 12px 11px;
    border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 14px 12px; font-size: 13.5px; border-bottom: 1px solid #23272d; }
  tbody tr:hover { background: #1c2026; }
  .who { display: flex; align-items: center; gap: 10px; }
  .av {
    width: 30px; height: 30px; border-radius: 999px; background: #333941;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #dde2ea;
    flex: 0 0 30px;
  }
  .av.pic { background: linear-gradient(135deg,#2f9fd8,#7a4bd0); color: #fff; }
  .em { color: var(--muted); font-size: 12px; }
  .tag { font-size: 12.5px; color: var(--muted); }

  #toast {
    position: fixed; right: 22px; bottom: 22px; background: #e9ecf1; color: #14161a;
    padding: 12px 18px; border-radius: 9px; font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<aside class="tree">
  <div class="tree-head">
    <div class="org">Longstraw Carbon</div>
    <h1>Datarooms</h1>
    <div class="search">⌕&nbsp; Search folders</div>
  </div>
  <div class="tree-list" id="tree"></div>
</aside>

<section class="main">
  <div class="topbar">
    <div class="crumb">All datarooms / <b>Terraton &lt;&gt; LongstrawCarbon</b></div>
    <div class="acts">
      <button class="btn">Invite</button>
      <button class="btn pri">Upload</button>
    </div>
  </div>

  <div class="content">
    <div class="lede">Terraton &lt;&gt; LongstrawCarbon <span>/ 64 files across 5 folders</span></div>

    <div class="sub">File types</div>
    <div class="cards" id="cards"></div>

    <div class="sub">Recently uploaded</div>
    <table>
      <thead>
        <tr><th style="width:42%">File</th><th>User</th><th>Folder</th><th>Size</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>

<div id="toast"></div>

<script>
const groups = [
  { g: 'Dataroom', folders: [
    { n: 'Financials', c: 12, kids: [ { n: 'FY25 Statements', c: 4 }, { n: 'Invoices', c: 8 } ] },
    { n: 'Legal', c: 7, kids: [ { n: 'SPAs', c: 3 }, { n: 'Board Resolutions', c: 4 } ] },
    { n: 'Technical', c: 21, kids: [ { n: 'Kiln Design', c: 9 }, { n: 'Mass Balance', c: 6 }, { n: 'Lab Results', c: 6 } ] },
    { n: 'Carbon MRV', c: 15, kids: [ { n: 'PDD', c: 5 }, { n: 'Monitoring Reports', c: 10 } ] },
    { n: 'Corporate', c: 9 },
  ]},
  { g: 'Other datarooms', folders: [
    { n: 'Sylvera - Due Diligence', c: 3 },
    { n: 'Jharkhand Feedstock', c: 11 },
  ]},
];
const types = [
  { i: '📄', n: 'PDD', c: '5 documents', b: 'Longstraw Carbon' },
  { i: '📊', n: 'Monitoring', c: '10 documents', b: 'Longstraw Carbon' },
  { i: '📐', n: 'Kiln Design', c: '9 documents', b: 'Longstraw Carbon' },
  { i: '🧪', n: 'Lab Results', c: '6 documents', b: 'Longstraw Carbon' },
];
const rows = [
  { f: 'Kalinga_PDD_v3.2.pdf', u: 'utkarsh@longstraw.in', ini: 'U', pic: false, d: 'Carbon MRV / PDD', s: '4.2 MB' },
  { f: 'Odisha_Biomass_Survey.xlsx', u: 'ernesto@longstraw.in', ini: 'E', pic: true, d: 'Technical / Mass Balance', s: '812 KB' },
  { f: 'Kiln_Performance_Q3.csv', u: 'utkarsh@longstraw.in', ini: 'U', pic: false, d: 'Carbon MRV / Monitoring', s: '126 KB' },
  { f: 'SPA_Terraton_executed.pdf', u: 'legal@longstraw.in', ini: 'L', pic: false, d: 'Legal / SPAs', s: '2.1 MB' },
];

const tree = document.getElementById('tree');
groups.forEach(gr => {
  tree.insertAdjacentHTML('beforeend', `<div class="grp">${gr.g}</div>`);
  gr.folders.forEach(f => {
    tree.insertAdjacentHTML('beforeend',
      `<div class="node" data-n="${f.n}"><span class="ic">▤</span><span class="nm">${f.n}</span><span class="ct">${f.c}</span></div>`);
    if (f.kids) tree.insertAdjacentHTML('beforeend',
      `<div class="kids">${f.kids.map(k =>
        `<div class="node" data-n="${f.n} / ${k.n}"><span class="ic">▢</span><span class="nm">${k.n}</span><span class="ct">${k.c}</span></div>`).join('')}</div>`);
  });
});

const cards = document.getElementById('cards');
types.forEach(t => cards.insertAdjacentHTML('beforeend',
  `<div class="card"><div class="top"><div class="thumb">${t.i}</div>
   <div><div class="nm">${t.n}</div><div class="brand">${t.b}</div></div></div>
   <div class="meta">${t.c}</div></div>`));

const rowsEl = document.getElementById('rows');
rows.forEach(r => rowsEl.insertAdjacentHTML('beforeend',
  `<tr><td>${r.f}</td>
   <td><div class="who"><div class="av ${r.pic ? 'pic' : ''}">${r.ini}</div><div><div>${r.u.split('@')[0]}</div><div class="em">${r.u}</div></div></div></td>
   <td class="tag">${r.d}</td><td class="tag">${r.s}</td></tr>`));

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
document.querySelectorAll('.node').forEach(n => n.addEventListener('click', () => {
  document.querySelectorAll('.node').forEach(x => x.classList.remove('sel'));
  n.classList.add('sel');
  toast('Opened ' + n.dataset.n);
}));
document.querySelector('.btn.pri').addEventListener('click', () => toast('Upload dialog'));
</script>
</body>
</html>
